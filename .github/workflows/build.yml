name: Build and QA

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, 'lean/**']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Format
        run: cargo fmt --check
      - name: Build (warnings are errors)
        run: RUSTFLAGS='-D warnings' cargo build --locked --release --bins --target '${{ matrix.target }}'
      - name: Real-use QA
        run: |
          mkdir -p target/release
          cp 'target/${{ matrix.target }}/release/am' target/release/am
          scripts/qa.sh "$PWD" qa-results.md
          cat qa-results.md >> "$GITHUB_STEP_SUMMARY"
      - name: Retain unsigned build output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: am-${{ matrix.target }}-unsigned
          path: target/${{ matrix.target }}/release/am
          if-no-files-found: error
          retention-days: 14
