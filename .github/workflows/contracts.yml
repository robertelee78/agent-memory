name: Rust contracts

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-contracts-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'

jobs:
  test:
    name: Test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        shell: sh
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
          rustc --version --verbose
      - name: Require the host triple
        shell: sh
        run: |
          test "$(rustc --version --verbose | sed -n 's/^host: //p')" = '${{ matrix.target }}'
      - name: Format
        shell: sh
        run: cargo fmt --check
      - name: Test
        shell: sh
        run: cargo test --locked

  musl:
    name: Static build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain and musl target
        shell: sh
        run: |
          rustup toolchain install stable --profile minimal --target '${{ matrix.target }}'
          rustup default stable
      - name: Build
        shell: sh
        run: cargo build --locked --release --bins --target '${{ matrix.target }}'
      - name: Require a static am
        shell: sh
        run: |
          binary='target/${{ matrix.target }}/release/am'
          test -f "$binary"
          file "$binary"
          file "$binary" | grep -Eq 'statically linked|static-pie linked'
      - name: Retain unsigned build output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: am-${{ matrix.target }}-unsigned
          path: target/${{ matrix.target }}/release/am
          if-no-files-found: error
          retention-days: 14

  gate:
    name: Complete Rust gate
    needs: [test, musl]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every test and static build
        env:
          TESTS: ${{ needs.test.result }}
          BUILDS: ${{ needs.musl.result }}
        run: test "$TESTS" = success && test "$BUILDS" = success
