name: Rust contracts

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-contracts-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'

jobs:
  test:
    name: Test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        shell: sh
        run: |
          rustup toolchain install
          rustc --version --verbose
      - name: Require a host that runs the target natively
        shell: sh
        run: |
          host=$(rustc --version --verbose | sed -n 's/^host: //p')
          test "${host%%-*}" = "$(printf '%s' '${{ matrix.target }}' | cut -d- -f1)"
      - name: Format
        shell: sh
        run: cargo fmt --check
      - name: Test
        shell: sh
        run: cargo test --locked --no-fail-fast --features dev-tools --target '${{ matrix.target }}'

  musl:
    name: Release build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        shell: sh
        run: rustup toolchain install
      - name: Build
        shell: sh
        run: cargo build --locked --release --bins --target '${{ matrix.target }}'
      - name: Require a static am on Linux
        if: endsWith(matrix.target, '-linux-musl')
        shell: sh
        run: |
          binary='target/${{ matrix.target }}/release/am'
          test -f "$binary"
          file "$binary"
          file "$binary" | grep -Eq 'statically linked|static-pie linked'
      - name: Retain unsigned build output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: am-${{ matrix.target }}-unsigned
          path: target/${{ matrix.target }}/release/am
          if-no-files-found: error
          retention-days: 14

  gate:
    name: Complete Rust gate
    needs: [test, musl]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every test and release build
        env:
          TESTS: ${{ needs.test.result }}
          BUILDS: ${{ needs.musl.result }}
        run: test "$TESTS" = success && test "$BUILDS" = success
